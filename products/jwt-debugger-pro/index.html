<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Debugger Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid rgba(233, 69, 96, 0.3);
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #a0a0a0; font-size: 1.1rem; }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .panel h2 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        textarea {
            width: 100%;
            min-height: 120px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            color: #e0e0e0;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: #e94560; }
        textarea.error { border-color: #ff4444; background: rgba(255, 68, 68, 0.1); }
        textarea.valid { border-color: #44ff44; background: rgba(68, 255, 68, 0.1); }
        .decoded-part {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 3px solid;
        }
        .decoded-part.header { border-left-color: #3498db; }
        .decoded-part.payload { border-left-color: #2ecc71; }
        .decoded-part.signature { border-left-color: #e94560; }
        .part-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            opacity: 0.8;
        }
        .header .part-label { color: #3498db; }
        .payload .part-label { color: #2ecc71; }
        .signature .part-label { color: #e94560; }
        pre {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .json-key { color: #9cdcfe; }
        .json-string { color: #ce9178; }
        .json-number { color: #b5cea8; }
        .json-boolean { color: #569cd6; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        button {
            background: linear-gradient(135deg, #e94560, #c73e54);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(233, 69, 96, 0.3); }
        button.secondary { background: rgba(255, 255, 255, 0.1); }
        button.secondary:hover { background: rgba(255, 255, 255, 0.2); }
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #e94560; }
        .stat-label { font-size: 0.85rem; color: #a0a0a0; margin-top: 5px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #a0a0a0; font-size: 0.9rem; }
        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 10px 15px;
            color: #e0e0e0;
            font-family: monospace;
        }
        .verify-result {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        .verify-result.valid { display: block; background: rgba(46, 204, 113, 0.2); border: 1px solid #2ecc71; }
        .verify-result.invalid { display: block; background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; }
        .timestamp-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        .timestamp-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .timestamp-row:last-child { border-bottom: none; }
        .timestamp-label { color: #a0a0a0; }
        .timestamp-value { font-family: monospace; }
        .expired { color: #e74c3c; }
        .valid { color: #2ecc71; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 JWT Debugger Pro</h1>
            <p class="subtitle">Professional JWT decoding, inspection & verification</p>
        </header>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="tokenLength">0</div>
                <div class="stat-label">Characters</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="tokenParts">0</div>
                <div class="stat-label">Parts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="tokenAlg">-</div>
                <div class="stat-label">Algorithm</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="tokenType">-</div>
                <div class="stat-label">Type</div>
            </div>
        </div>

        <div class="main-grid">
            <div class="panel">
                <h2>Input Token</h2>
                <div class="controls">
                    <button onclick="decodeJWT()">Decode</button>
                    <button class="secondary" onclick="loadSample('basic')">Sample: Basic</button>
                    <button class="secondary" onclick="loadSample('expired')">Sample: Expired</button>
                    <button class="secondary" onclick="clearToken()">Clear</button>
                </div>
