<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a1a2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid Pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(139,92,246,0.1)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative Circles -->
  <circle cx="100" cy="100" r="300" fill="url(#accentGrad)" opacity="0.05" filter="url(#glow)"/>
  <circle cx="1100" cy="530" r="250" fill="url(#accentGrad)" opacity="0.05" filter="url(#glow)"/>

  <!-- Icon/Logo -->
  <g transform="translate(550, 180)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#accentGrad)" filter="url(#glow)"/>
    <text x="50" y="70" text-anchor="middle" fill="white" font-size="50" font-family="system-ui, sans-serif" font-weight="bold">M</text>
  </g>

  <!-- Title -->
  <text x="600" y="340" text-anchor="middle" fill="white" font-size="72" font-family="system-ui, sans-serif" font-weight="800" letter-spacing="-2">MetaFetch</text>

  <!-- Tagline -->
  <text x="600" y="400" text-anchor="middle" fill="#94a3b8" font-size="28" font-family="system-ui, sans-serif">Extract Website Metadata in Seconds</text>

  <!-- Feature Pills -->
  <g transform="translate(600, 460)">
    <rect x="-180" y="0" width="120" height="36" rx="18" fill="rgba(139,92,246,0.2)" stroke="rgba(139,92,246,0.5)" stroke-width="1"/>
    <text x="-120" y="24" text-anchor="middle" fill="#c4b5fd" font-size="14" font-family="system-ui, sans-serif" font-weight="600">Open Graph</text>

    <rect x="-50" y="0" width="100" height="36" rx="18" fill="rgba(139,92,246,0.2)" stroke="rgba(139,92,246,0.5)" stroke-width="1"/>
    <text x="0" y="24" text-anchor="middle" fill="#c4b5fd" font-size="14" font-family="system-ui, sans-serif" font-weight="600">Meta Tags</text>

    <rect x="70" y="0" width="110" height="36" rx="18" fill="rgba(139,92,246,0.2)" stroke="rgba(139,92,246,0.5)" stroke-width="1"/>
    <text x="125" y="24" text-anchor="middle" fill="#c4b5fd" font-size="14" font-family="system-ui, sans-serif" font-weight="600">Favicons</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="450" y="560" width="300" height="4" rx="2" fill="url(#accentGrad)"/>
</svg>
