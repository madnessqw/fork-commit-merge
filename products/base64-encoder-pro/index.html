<body>
    <div class="container">
        <header>
            <h1>Base64 Encoder Pro</h1>
            <p class="subtitle">Professional encoding/decoding with URL-safe mode & batch processing</p>
        </header>

        <div class="controls">
            <button onclick="encode()">Encode</button>
            <button onclick="decode()">Decode</button>
            <button onclick="swap()">Swap</button>
            <button onclick="copyOutput()" class="secondary">Copy</button>
            <button onclick="clearAll()" class="secondary">Clear</button>
            <button onclick="loadSample()" class="secondary">Sample</button>
        </div>

        <div class="options">
            <label class="option">
                <input type="checkbox" id="urlSafe">
                <span>URL-Safe Mode</span>
            </label>
            <label class="option">
                <input type="checkbox" id="removePadding">
                <span>Remove Padding</span>
            </label>
        </div>

        <div class="main-grid">
            <div class="panel">
                <h2>Input</h2>
                <textarea id="input" placeholder="Enter text to encode or Base64 to decode..."></textarea>
            </div>
            <div class="panel">
                <h2>Output</h2>
                <textarea id="output" placeholder="Result will appear here..." readonly></textarea>
            </div>
        </div>

        <div id="message"></div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="inputChars">0</div>
                <div class="stat-label">Input Chars</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="outputChars">0</div>
                <div class="stat-label">Output Chars</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="ratio">0%</div>
                <div class="stat-label">Size Ratio</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="saved">0</div>
                <div class="stat-label">Bytes Saved</div>
            </div>
        </div>

        <footer>
            <p>Base64 Encoder Pro v1.0 | Built for developers</p>
        </footer>
    </div>

    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const urlSafe = document.getElementById('urlSafe');
        const removePadding = document.getElementById('removePadding');

        input.addEventListener('input', updateStats);

        function encode() {
            const text = input.value;
            if (!text) {
                showMessage('Please enter text to encode', 'error');
                return;
            }
            
            try {
                let encoded = btoa(unescape(encodeURIComponent(text)));
                
                if (urlSafe.checked) {
                    encoded = encoded.replace(/\+/g, '-').replace(/\//g, '_');
                }
                
                if (removePadding.checked) {
                    encoded = encoded.replace(/=+$/, '');
                }
                
                output.value = encoded;
                updateStats();
                showMessage('Encoded successfully!', 'success');
            } catch (e) {
                showMessage('Error encoding: ' + e.message, 'error');
            }
        }

        function decode() {
            const text = input.value.trim();
            if (!text) {
                showMessage('Please enter Base64 to decode', 'error');
                return;
            }
            
            try {
                let cleaned = text;
                
                if (urlSafe.checked) {
                    cleaned = cleaned.replace(/-/g, '+').replace(/_/g, '/');
                }
                
                // Add padding if needed
                while (cleaned.length % 4 !== 0) {
                    cleaned += '=';
                }
                
                const decoded = decodeURIComponent(escape(atob(cleaned)));
                output.value = decoded;
                updateStats();
                showMessage('Decoded successfully!', 'success');
            } catch (e) {
                showMessage('Invalid Base64: ' + e.message, 'error');
            }
        }

        function swap() {
            const temp = input.value;
            input.value = output.value;
            output.value = temp;
            updateStats();
        }

        function copyOutput() {
            if (!output.value) {
                showMessage('Nothing to copy', 'error');
                return;
            }
            navigator.clipboard.writeText(output.value).then(() => {
                showMessage('Copied to clipboard!', 'success');
            });
        }

        function clearAll() {
            input.value = '';
            output.value = '';
            updateStats();
            document.getElementById('message').innerHTML = '';
        }

        function loadSample() {
            input.value = 'Hello, World! This is Base64 Encoder Pro.';
            encode();
        }

        function updateStats() {
            const inLen = input.value.length;
            const outLen = output.value.length;
            
            document.getElementById('inputChars').textContent = inLen.toLocaleString();
            document.getElementById('outputChars').textContent = outLen.toLocaleString();
            
            if (inLen > 0 && outLen > 0) {
                const ratio = ((outLen / inLen) * 100).toFixed(1);
                document.getElementById('ratio').textContent = ratio + '%';
                document.getElementById('saved').textContent = (outLen - inLen).toLocaleString();
            } else {
                document.getElementById('ratio').textContent = '0%';
                document.getElementById('saved').textContent = '0';
            }
        }

        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = '<div class="message ' + type + '">' + msg + '</div>';
            setTimeout(() => { msgDiv.innerHTML = ''; }, 3000);
        }
    </script>
