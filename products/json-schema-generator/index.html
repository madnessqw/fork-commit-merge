  <style>
    body { background: #0a0a0f; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }

    .btn:hover { background: #4f46e5; transform: translateY(-1px); }

    .card { background: #14141f; border: 1px solid #1e1e2e; border-radius: 0.75rem; }
    .badge { background: #1e1e2e; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }

    .toggle.active { background: #6366f1; }
    .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: transform 0.2s; }
    .toggle.active::after { transform: translateX(20px); }

<body class="min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold mb-2">JSON Schema Generator</h1>
      <p class="text-muted">Generate JSON Schema from sample JSON instantly</p>
    </header>

    <div class="grid lg:grid-cols-2 gap-6">
      <!-- Input Panel -->
      <div class="card p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold">Input JSON</h2>
          <div class="flex items-center gap-3">
            <label class="text-sm text-muted">Draft Version:</label>
            <select id="draftVersion" class="bg-surface border border-border rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
              <option value="draft-07">Draft-07</option>
              <option value="2019-09">2019-09</option>
              <option value="2020-12">2020-12</option>
            </select>
          </div>
        </div>
        <textarea id="jsonInput" class="w-full h-80 bg-bg border border-border rounded-lg p-4 font-mono text-sm text-text placeholder-muted focus:outline-none focus:ring-2 focus:ring-accent" placeholder='Paste your JSON here, e.g.:
{
  "name": "John Doe",
  "email": "john@example.com",
  "age": 30,
  "active": true,
  "tags": ["developer", "admin"],
  "address": {
    "city": "New York",
    "zip": "10001"
  }
}'></textarea>
        <div id="inputError" class="mt-3 text-sm text-red-500 hidden"></div>
      </div>

      <!-- Output Panel -->
      <div class="card p-6 relative">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold">Generated Schema</h2>
          <button id="copyBtn" class="btn flex items-center gap-2" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            <span>Copy</span>
            <span id="copyFeedback" class="copy-feedback">Copied!</span>
          </button>
        </div>
        <pre id="schemaOutput" class="schema-output bg-bg border border-border rounded-lg overflow-auto"><code class="font-mono text-sm text-muted">Generated schema will appear here...</code></pre>
        <div id="outputStats" class="mt-3 flex items-center gap-4 text-sm text-muted"></div>
      </div>
    </div>

    <!-- Options -->
    <div class="card p-6 mt-6">
      <h2 class="text-lg font-semibold mb-4">Schema Options</h2>
      <div class="flex flex-wrap gap-6">
        <label class="flex items-center gap-3 cursor-pointer">
          <div id="toggleRequired" class="toggle active" onclick="toggleOption(this)"></div>
          <span class="text-sm">Detect required fields</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer">
          <div id="toggleEnum" class="toggle active" onclick="toggleOption(this)"></div>
          <span class="text-sm">Extract enum values</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer">
          <div id="togglePattern" class="toggle active" onclick="toggleOption(this)"></div>
          <span class="text-sm">Generate patterns</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer">
          <div id="toggleType" class="toggle active" onclick="toggleOption(this)"></div>
          <span class="text-sm">Strict type inference</span>
        </label>
        <div class="flex items-center gap-3">
          <label class="text-sm text-muted">Max depth:</label>
          <input type="range" id="depthSlider" min="1" max="10" value="5" class="w-24" oninput="updateDepthLabel(this.value)">
          <span id="depthLabel" class="text-sm font-medium w-6">5</span>
        </div>
      </div>
    </div>

    <!-- Export -->
    <div class="card p-6 mt-6">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">Export</h2>
        <div class="flex items-center gap-3">
          <select id="exportFormat" class="bg-surface border border-border rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            <option value="json">JSON Schema</option>
            <option value="typescript">TypeScript Interface</option>
          </select>
          <button id="exportBtn" class="btn" disabled>Export</button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-8 text-sm text-muted">
      <p>Supports Draft-07, Draft 2019-09, and Draft 2020-12</p>
    </footer>
  </div>

  <script>
    const jsonInput = document.getElementById('jsonInput');
    const schemaOutput = document.getElementById('schemaOutput');
    const inputError = document.getElementById('inputError');
    const copyBtn = document.getElementById('copyBtn');
    const copyFeedback = document.getElementById('copyFeedback');
    const exportBtn = document.getElementById('exportBtn');
    const exportFormat = document.getElementById('exportFormat');
    const outputStats = document.getElementById('outputStats');
    const draftVersion = document.getElementById('draftVersion');

    let generatedSchema = null;
    let currentOptions = {
      required: true,
      enum: true,
      pattern: true,
      strictType: true,
      maxDepth: 5
    };

    function toggleOption(el) {
      el.classList.toggle('active');
    }

    function updateDepthLabel(val) {
      document.getElementById('depthLabel').textContent = val;
      currentOptions.maxDepth = parseInt(val);
      if (jsonInput.value.trim()) generateSchema();
    }

    function parseJSON(str) {
      try {
        return JSON.parse(str);
      } catch (e) {
        throw new Error(`Invalid JSON: ${e.message}`);
      }
    }

    function inferType(value) {
      if (value === null) return 'null';
      if (Array.isArray(value)) return 'array';
      if (typeof value === 'object') return 'object';
      if (typeof value === 'number') return value % 1 === 0 ? 'integer' : 'number';
      if (typeof value === 'boolean') return 'boolean';
      if (typeof value === 'string') return 'string';
      return 'string';
    }

    function generateSchema(obj, options = currentOptions, depth = 0, path = '') {
      if (depth > options.maxDepth) return {};

      const schema = {
        '$schema': `https://json-schema.org/draft/${draftVersion.value === 'draft-07' ? '07' : draftVersion.value === '2019-09' ? '2019-09' : '2020-12'}/schema#`
      };

      const type = inferType(obj);

      if (type === 'object' && obj !== null) {
        const properties = {};
        const required = [];

        for (const [key, value] of Object.entries(obj)) {
          const currentPath = path ? `${path}.${key}` : key;
          properties[key] = generateSchema(value, options, depth + 1, currentPath);

          if (options.required && value !== null && value !== undefined && value !== '') {
            required.push(key);
          }
        }

        schema.type = 'object';
        schema.properties = properties;
        if (required.length > 0) schema.required = required;

      } else if (type === 'array' && obj.length > 0) {
        const items = obj.map((item, i) => generateSchema(item, options, depth + 1, `${path}[${i}]`));
        const uniqueTypes = [...new Set(items.map(s => JSON.stringify(s)))];

        if (uniqueTypes.length === 1) {
          schema.items = items[0];
        } else {
          schema.items = { oneOf: [...new Set(items.map(s => JSON.stringify(s))).values()].map(s => JSON.parse(s)) };
        }
        schema.type = 'array';

      } else if (type === 'null') {
        schema.type = 'null';

      } else if (type === 'string') {
        schema.type = 'string';
        if (options.pattern) {
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          const urlRegex = /^(https?:\/\/)?([\da-z.-]+)\.([a-z.]{2,6})([\/\w .-]*)*\/?$/;
          const dateRegex = /^\d{4}-\d{2}-\d{2}$/;

          if (emailRegex.test(obj)) schema.format = 'email';
          else if (urlRegex.test(obj)) schema.format = 'uri';
          else if (dateRegex.test(obj)) schema.format = 'date';
        }

      } else if (type === 'integer' || type === 'number') {
        schema.type = inferType(obj);

      } else if (type === 'boolean') {
        schema.type = 'boolean';
      }

      if (options.enum && type === 'string' && obj.length < 20) {
        schema.enum = [obj];
      }

      return schema;
    }

    function jsonToSchema(jsonObj, options) {
      const schema = generateSchema(jsonObj, options);
      return schema;
    }

    function schemaToTypeScript(schema, name = 'Root') {
      const lines = [];

      function processSchema(schema, propName, isRequired = true) {
        const indent = '  ';
        let result = '';

        if (schema.type === 'object' && schema.properties) {
          result += `interface ${name} {\n`;
          for (const [key, propSchema] of Object.entries(schema.properties)) {
            const optional = !isRequired && !schema.required?.includes(key) ? '?' : '';
            const propType = propSchema.oneOf
              ? propSchema.oneOf.map(s => inferTypeName(s)).join(' | ')
              : inferTypeName(propSchema);
            result += `${indent}${key}${optional}: ${propType};\n`;
          }
          result += '}';
        } else {
          result = inferTypeName(schema);
        }

        return result;
      }

      function inferTypeName(schema) {
        if (schema.oneOf) return schema.oneOnf.map(s => inferTypeName(s)).join(' | ');
        if (schema.type === 'string') return 'string';
        if (schema.type === 'number' || schema.type === 'integer') return 'number';
        if (schema.type === 'boolean') return 'boolean';
        if (schema.type === 'null') return 'null';
        if (schema.type === 'array') return inferTypeName(schema.items) + '[]';
        if (schema.type === 'object') return 'Record<string, any>';
        return 'any';
      }

      return processSchema(schema, 'Root');
    }

    function generateSchema() {
      const input = jsonInput.value.trim();

      if (!input) {
        schemaOutput.innerHTML = '<code class="font-mono text-sm text-muted">Generated schema will appear here...</code>';
        copyBtn.disabled = true;
        exportBtn.disabled = true;
        inputError.classList.add('hidden');
        outputStats.innerHTML = '';
        generatedSchema = null;
        return;
      }

      try {
        currentOptions.required = document.getElementById('toggleRequired').classList.contains('active');
        currentOptions.enum = document.getElementById('toggleEnum').classList.contains('active');
        currentOptions.pattern = document.getElementById('togglePattern').classList.contains('active');
        currentOptions.strictType = document.getElementById('toggleType').classList.contains('active');

        const jsonObj = parseJSON(input);
        generatedSchema = jsonToSchema(jsonObj, currentOptions);

        schemaOutput.innerHTML = `<code>${JSON.stringify(generatedSchema, null, 2)}</code>`;
        copyBtn.disabled = false;
        exportBtn.disabled = false;
        inputError.classList.add('hidden');

        const fieldCount = JSON.stringify(generatedSchema.properties || {}).split('"').length / 2;
        const typeCount = Object.keys(generatedSchema.properties || {}).length;
        outputStats.innerHTML = `<span class="badge">${typeCount} fields</span><span class="badge">${Object.keys(generatedSchema.properties || {}).length} properties</span>`;

      } catch (e) {
        inputError.textContent = e.message;
        inputError.classList.remove('hidden');
        generatedSchema = null;
        copyBtn.disabled = true;
        exportBtn.disabled = true;
      }
    }

    // Live generation with debounce
    let debounceTimer;
    jsonInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(generateSchema, 300);
    });

    draftVersion.addEventListener('change', generateSchema);

    // Copy functionality
    copyBtn.addEventListener('click', async () => {
      if (!generatedSchema) return;
      try {
        await navigator.clipboard.writeText(JSON.stringify(generatedSchema, null, 2));
        copyFeedback.classList.add('show');
        setTimeout(() => copyFeedback.classList.remove('show'), 1500);
      } catch (e) {
        console.error('Copy failed:', e);
      }
    });

    // Export functionality
    exportBtn.addEventListener('click', () => {
      if (!generatedSchema) return;

      let content, filename, mimeType;

      if (exportFormat.value === 'typescript') {
        content = schemaToTypeScript(generatedSchema);
        filename = 'schema.ts';
        mimeType = 'text/plain';
      } else {
        content = JSON.stringify(generatedSchema, null, 2);
        filename = 'schema.json';
        mimeType = 'application/json';
      }

      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Auto-generate on page load if input has content
    if (jsonInput.value.trim()) {
      generateSchema();
    }
  </script>
</body>
