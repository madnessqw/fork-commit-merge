header("Content-Type: application/json; charset=UTF-8");

if (!isset($_GET['link']) || empty($_GET['link'])) {
    echo json_encode([], JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE);
    exit;
}

$domain = htmlspecialchars($_GET['link']);
$crt_sh_url = "https://crt.sh/?q=%25.$domain&output=json";
$response = @file_get_contents($crt_sh_url);

if ($response === FALSE) {
    echo json_encode([], JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE);
    exit;
}

$data = json_decode($response, true);
$subdomains = [];

if (!empty($data)) {
    foreach ($data as $entry) {
        $splitted = preg_split('/\r\n|\r|\n/', $entry['name_value']);
        foreach ($splitted as $sub) {
            $sub = trim($sub);
            if (strpos($sub, "*.") === 0) {
                continue;
            }
            $subdomains[] = $sub;
        }
    }
}

$subdomains = array_values(array_unique($subdomains));
$filtered_subdomains = [];

foreach ($subdomains as $sub) {
    if (strpos($sub, "www.") === 0) {
        $non_www = substr($sub, 4);
        if (in_array($non_www, $subdomains)) {
            continue;
        }
    }
    $filtered_subdomains[] = $sub;
}

if (($key = array_search($domain, $filtered_subdomains)) !== false) {
    unset($filtered_subdomains[$key]);
    array_unshift($filtered_subdomains, $domain);
}

// JSON Response for Subdomains
echo json_encode($filtered_subdomains, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE);

// Debugging & Server Info Section
echo "\n\n===================\n";
echo "Server Info (PHPInfo):\n";
echo "===================\n\n";
