                    - heading "Problem" [level=2] [ref=e209]
                    - paragraph [ref=e210]:
                      - text: The CategoryTree component was not displaying all child categories when a parent category had more than 20 children (default pagination limit). This was reported in issue
                      - link "#630" [ref=e211] [cursor=pointer]:
                        - /url: https://github.com/evershopcommerce/evershop/issues/630
                      - text: where a category with 75 child rows in the database only showed a subset in the UI.
                    - heading "Root Cause" [level=2] [ref=e212]
                    - paragraph [ref=e213]: The GraphQL queries in CategoryTree.tsx did not specify pagination parameters, causing the API to apply default pagination (20 items per page). This meant only 20 child categories were fetched regardless of the actual number of children.
                    - heading "Changes" [level=2] [ref=e214]
                    - list [ref=e215]:
                      - listitem [ref=e216]: Added limit filter to both root categories query and children queries to fetch up to 1000 categories
                      - listitem [ref=e217]: "Fixed React key prop warnings by changing key={child.value} to key={child.categoryId}"
                      - listitem [ref=e218]: Added total field to childrenQuery for potential future pagination UI improvements
                    - heading "Testing" [level=2] [ref=e219]
                    - list [ref=e220]:
                      - listitem [ref=e221]: Categories with 75+ children now display correctly
                      - listitem [ref=e222]: No more React key warnings in console
                      - listitem [ref=e223]: Backward compatible
