<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Product — $1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #1a1a2e;
      color: #6366f1;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 99px;
      border: 1px solid #2d2d5e;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: #888;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .price {
      font-size: 48px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }
    .price span {
      font-size: 20px;
      color: #555;
      font-weight: 400;
    }
    .note {
      font-size: 12px;
      color: #555;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: #6366f1;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 36px;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }
    .btn:hover { background: #4f52d9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .secure {
      margin-top: 16px;
      font-size: 12px;
      color: #444;
    }
    .secure span { color: #6366f1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Test Purchase</div>
    <h1>Test Product</h1>
    <p>This is a test purchase to verify the payment flow works correctly end-to-end.</p>
    <div class="price">$1 <span>/ one-time</span></div>
    <div class="note">One-time payment · No subscription</div>
    <a href="https://profitbridge.lemonsqueezy.com/checkout/buy/c72cb95b-043f-446c-bfa2-d083d278fadc" class="btn">
      Buy Now — $1
    </a>
    <div class="secure">🔒 Secure checkout powered by <span>LemonSqueezy</span></div>
  </div>
</body>
</html>
