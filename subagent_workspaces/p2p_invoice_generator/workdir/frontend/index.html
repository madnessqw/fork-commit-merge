<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Invoice Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>P2P Invoice Generator</h1>
            <p>Generate professional invoices with embedded payment links.</p>
        </header>

        <main>
            <div class="card">
                <form id="invoiceForm">
                    <div class="section">
                        <h2>Sender Info</h2>
                        <div class="form-group">
                            <label for="senderName">Name</label>
                            <input type="text" id="senderName" value="Jane Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="senderAddress">Address</label>
                            <input type="text" id="senderAddress" value="123 Main St" required>
                        </div>
                        <div class="form-group">
                            <label for="senderTaxId">Tax ID</label>
                            <input type="text" id="senderTaxId" value="1234567890" required>
                        </div>
                    </div>

                    <div class="section">
                        <h2>Recipient Info</h2>
                        <div class="form-group">
                            <label for="recipientName">Name</label>
                            <input type="text" id="recipientName" value="Acme Corp" required>
                        </div>
                        <div class="form-group">
                            <label for="recipientAddress">Address</label>
                            <input type="text" id="recipientAddress" value="456 Corp Blvd" required>
                        </div>
                    </div>

                    <div class="section">
                        <h2>Item Info</h2>
                        <div class="form-group">
                            <label for="itemDescription">Description</label>
                            <input type="text" id="itemDescription" value="Web Development" required>
                        </div>
                        <div class="form-group row">
                            <div class="col">
                                <label for="itemQuantity">Quantity</label>
                                <input type="number" id="itemQuantity" value="1" required>
                            </div>
                            <div class="col">
                                <label for="itemPrice">Price</label>
                                <input type="number" id="itemPrice" value="1000.00" step="0.01" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="currency">Currency</label>
                            <select id="currency">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="TRY">TRY</option>
                            </select>
                        </div>
                    </div>

                    <div class="section">
                        <h2>Payment Methods (Embedded)</h2>
                        <div class="form-group">
                            <label for="paypalEmail">PayPal Email</label>
                            <input type="email" id="paypalEmail" value="jane.doe@paypal.com">
                        </div>
                        <div class="form-group">
                            <label for="akbankIban">Akbank IBAN</label>
                            <input type="text" id="akbankIban" value="TR120000000000000000000000">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn">Generate Invoice</button>
                </form>
            </div>

            <div id="resultArea" class="hidden card result-card">
                <!-- Results will be injected here -->
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
